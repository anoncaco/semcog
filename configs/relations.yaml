# relations — 술어 사전 + 한국어 문형 규칙 (v0.1)
#
# 기준: summary_arch.md §7.3 (v1.3), §7.5.1 개발자 직접 등록 경로
# 규칙:
#   - 코드 하드코딩 금지. 규칙은 이 파일에 선언한다.
#   - 문형 **행은 9개로 고정** (§19 #13). 표면형 추가는 같은 행에 붙인다. 새 행 추가는 구조 변경이다.
#   - 변경 시 version bump + 회귀 green + ADR (docs/decisions/) — §7.5.1 게이트 4조건
#
# status:
#   proposed  — 초안. Phase 3에서 72문장으로 정밀도/재현율 측정 후 confirmed
#   confirmed — 통과 기준 충족

version: "0.1.1"
status: proposed

# ---------------------------------------------------------------- 술어 사전 (최소 집합, 11종)
# 새 관계 유형은 §7.9의 add_relation_type 절차로만 활성화한다.
predicates:
  is_a:             { description: "A는 B의 하위 분류/-instance", type: "classification" }
  instance_of:      { description: "A는 B의 instance",              type: "classification" }
  has_property:     { description: "A는 속성 B를 가진다",           type: "attribute" }
  causes:           { description: "X가 Y의 원인이다",              type: "causal" }
  supports:         { description: "A가 B를 지지한다",              type: "evidential" }
  contradicts:      { description: "A가 B를 반박한다",              type: "evidential" }
  similar_to:       { description: "A는 B와 유사하다",              type: "similarity" }
  part_of:          { description: "A는 B의 부분이다",             type: "structural" }
  located_at:       { description: "A는 B에 위치한다",              type: "structural" }
  before:           { description: "A는 B보다 먼저이다",           type: "temporal" }
  after:            { description: "A는 B보다 나중이다",            type: "temporal" }

# 대응 술어 (negation counterpart) — **표현용 별칭**. 부정을 새 술어로 만들지 않고 polarity=negative로 표기한다 (P9)
#
# ⚠️ 이 값들(not_is_a 등)은 절대로 RelationRecord.predicate에 넣지 않는다.
#    저장되는 predicate는 위 `predicates:` 11종의 값만이고, 부정 여부는 polarity 필드가 담는다.
#    (summary_arch.md §7.3 대응 술어 규칙 · §8.2 · docs/DATA_MODEL.md §3.2 · ADR-0011)
counterparts:
  is_a: not_is_a
  has_property: not_has_property
  instance_of: not_instance_of
  similar_to: not_similar_to

# 양태 / 수량사
quantifiers: [possible, typical, all, exists, some, specific_instance]
polarities: [positive, negative]

# 양태 판정 순서 — 먼저 매칭되는 것만 적용한다
quantifier_precedence: [all, some, possible, typical]

# 주체 조사 — 모두 허용. '도' 는 주어를 바꾸지 않는다.
subject_particles: ["는", "은", "도", "가"]
object_particles: ["를", "을", "이", "가", "은", "는"]

# ---------------------------------------------------------------- 한국어 문형 (9행 고정)
#
# slots:
#   subject   — 주어. node_type은 관계 위치로 결정한다 (§8.10, ADR-0008)
#   attribute — 속성. configs/attributes.yaml로 정규화한다
#   object    — 대상/상위 분류
#
patterns:
  - id: is_a_typical
    predicate: is_a
    quantifier: typical
    polarity: positive
    slots: { subject: subject, object: object }
    surface_forms:
      - "A는 B이다"
      - "A는 B다"
    example: "고양이는 동물이다"

  - id: is_a_all
    predicate: is_a
    quantifier: all
    polarity: positive
    slots: { subject: subject, object: object }
    surface_forms:
      - "모든 A는 B이다"
      - "A는 전부 B이다"
    example: "모든 새는 날 수 있다"

  - id: is_a_some
    predicate: is_a
    quantifier: some
    polarity: positive
    slots: { subject: subject, object: object }
    surface_forms:
      - "일부 A는 B이다"
      - "가끔 A는 B이다"
    example: "일부 새는 날 수 있다"

  - id: has_property_possible
    predicate: has_property
    quantifier: possible
    polarity: positive
    slots: { subject: subject, attribute: attribute }
    surface_forms:
      - "A는 B일 수 있다"
      - "A는 B일 가능성이 있다"
      - "A도 B를 가질 수 있다"     # §10.2 입력2 (ADR-0004)
      - "A가 B를 가질 수 있다"
    example: "개도 뾰족한 귀를 가질 수 있다"

  - id: has_property_typical
    predicate: has_property
    quantifier: typical
    polarity: positive
    slots: { subject: subject, attribute: attribute }
    surface_forms:
      - "A는 B를 가진다"
      - "A의 B"                     # §10.2 입력1 (ADR-0004)
      - "A의 B가 C하다"
    attribute_normalize: true        # configs/attributes.yaml 적용
    example: "동물 A의 귀가 뾰족하다"

  - id: is_a_negative
    predicate: is_a
    quantifier: typical
    polarity: negative
    slots: { subject: subject, object: object }
    surface_forms:
      - "A는 B가 아니다"
    counterpart: not_is_a
    example: "고양이는 동물이 아니다"

  - id: is_a_also
    predicate: is_a
    quantifier: typical
    polarity: positive
    slots: { subject: subject, object: object }
    surface_forms:
      - "A도 B이다"
    example: "고양이도 동물이다"

  - id: causes_instance
    predicate: causes
    quantifier: specific_instance
    polarity: positive
    slots: { subject: subject, object: object }
    surface_forms:
      - "X 때문에 A가 B이다"
    example: "화재 때문에 연기가 퍼졌다"

  - id: unparsable
    predicate: null
    quantifier: null
    polarity: null
    slots: {}
    surface_forms:
      - "A는 B보다 크다"             # 명시된 비지원 예시
    example: "고양이는 개보다 크다"

# ---------------------------------------------------------------- Parse 동작
parser:
  name: rule_parser_v1
  method: rule_based               # 정규식 + 패턴 매칭. LLM 미사용 (§7.3)
  morphology_analyzer: null        # §19 #14 — 정규식만으로 9행을 못 처리할 때만 "kiwipiepy"
  unparsed_policy: keep            # 억지 사실을 만들지 않는다. 남긴다.
  candidate_status: candidate      # accepted가 되려면 V의 검증이 필요하다
  created_by: parse

# ---------------------------------------------------------------- 규칙 확장 절차 (§7.3, §7.5.1)
# 1) configs/relations.yaml에 규칙 추가 (version bump)
# 2) tests/fixtures/parsing/ 에 예문 추가
# 3) precision/recall 재측정
# 4) 통과 시에만 status를 confirmed로 변경
# 5) ADR 기록 (docs/decisions/)
